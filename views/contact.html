<main id="main" class="container">
  <section class="contact-section">
    <h1>Contactez-nous</h1>
    <p>Une question ou un projet ? Laissez-nous un message.</p>
    
    <form class="contact-form">
      <div class="form-group">
        <label for="name">Nom complet</label>
        <input type="text" id="name" required placeholder="Votre nom">
      </div>
      <div class="form-group">
        <label for="email">Adresse e-mail</label>
        <input type="email" id="email" required placeholder="exemple@domaine.com">
      </div>
      <div class="form-group">
        <label for="message">Message</label>
        <textarea id="message" rows="4" required placeholder="Votre message..."></textarea>
      </div>
      <button type="submit" class="btn">Envoyer</button>
    </form>
  </section>
</main>
